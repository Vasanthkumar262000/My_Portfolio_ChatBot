# Cloud Build configuration for automated deployments
# This file is used by Cloud Build for CI/CD pipelines

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/chatbot-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/chatbot-api:latest'
      - '.'
    id: 'build-image'

  # Step 2: Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/chatbot-api:$COMMIT_SHA'
    id: 'push-image'
    waitFor:
      - 'build-image'

  # Step 3: Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/chatbot-api:latest'
    id: 'push-latest'
    waitFor:
      - 'build-image'

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'chatbot-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/chatbot-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
    id: 'deploy'
    waitFor:
      - 'push-image'

# Store the images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/chatbot-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/chatbot-api:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Timeout for the entire build (20 minutes)
timeout: '1200s'

# Substitutions (can be overridden)
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'chatbot-api'
